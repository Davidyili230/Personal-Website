name: Sync resume.json from resume.tex

on:
  push:
    paths:
      - "resume.tex"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate data/resume.json from resume.tex
        run: node scripts/sync-resume.js

      - name: Commit changes if resume.json was updated
        run: |
          if [ -n "$(git status --porcelain data/resume.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/resume.json
            git commit -m "chore: sync resume.json from resume.tex [skip ci]"
            git push
          else
            echo "No changes to data/resume.json"
          fi
